<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Twitch Arcane Follower Alert</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="alert_outer-container has-animation" lang="en">
    <div class="alert_widget-container">
        <div class="alert_image-container">

            <div class="lightning-flash"></div>

            <!-- TOP EDGE -->
            <div class="lightning-bolt bolt-top-left"><span class="bolt-segment main s1"></span><span class="bolt-segment main s2"></span><span class="bolt-segment main s3"></span><span class="bolt-segment main s4"></span><span class="bolt-segment main s5"></span><span class="bolt-segment main s6"></span><span class="bolt-segment branch b1"></span><span class="bolt-segment branch b2"></span><span class="bolt-segment branch b3"></span><span class="bolt-segment branch b4"></span></div>
            <div class="lightning-bolt bolt-top-center"><span class="bolt-segment main s1"></span><span class="bolt-segment main s2"></span><span class="bolt-segment main s3"></span><span class="bolt-segment main s4"></span><span class="bolt-segment main s5"></span><span class="bolt-segment main s6"></span><span class="bolt-segment branch b1"></span><span class="bolt-segment branch b2"></span><span class="bolt-segment branch b3"></span><span class="bolt-segment branch b4"></span></div>
            <div class="lightning-bolt bolt-top-right"><span class="bolt-segment main s1"></span><span class="bolt-segment main s2"></span><span class="bolt-segment main s3"></span><span class="bolt-segment main s4"></span><span class="bolt-segment main s5"></span><span class="bolt-segment main s6"></span><span class="bolt-segment branch b1"></span><span class="bolt-segment branch b2"></span><span class="bolt-segment branch b3"></span><span class="bolt-segment branch b4"></span></div>

            <!-- RIGHT EDGE -->
            <div class="lightning-bolt bolt-right-top"><span class="bolt-segment main s1"></span><span class="bolt-segment main s2"></span><span class="bolt-segment main s3"></span><span class="bolt-segment main s4"></span><span class="bolt-segment main s5"></span><span class="bolt-segment main s6"></span><span class="bolt-segment branch b1"></span><span class="bolt-segment branch b2"></span><span class="bolt-segment branch b3"></span><span class="bolt-segment branch b4"></span></div>
            <div class="lightning-bolt bolt-right-center"><span class="bolt-segment main s1"></span><span class="bolt-segment main s2"></span><span class="bolt-segment main s3"></span><span class="bolt-segment main s4"></span><span class="bolt-segment main s5"></span><span class="bolt-segment main s6"></span><span class="bolt-segment branch b1"></span><span class="bolt-segment branch b2"></span><span class="bolt-segment branch b3"></span><span class="bolt-segment branch b4"></span></div>
            <div class="lightning-bolt bolt-right-bottom"><span class="bolt-segment main s1"></span><span class="bolt-segment main s2"></span><span class="bolt-segment main s3"></span><span class="bolt-segment main s4"></span><span class="bolt-segment main s5"></span><span class="bolt-segment main s6"></span><span class="bolt-segment branch b1"></span><span class="bolt-segment branch b2"></span><span class="bolt-segment branch b3"></span><span class="bolt-segment branch b4"></span></div>

            <!-- BOTTOM EDGE -->
            <div class="lightning-bolt bolt-bottom-right"><span class="bolt-segment main s1"></span><span class="bolt-segment main s2"></span><span class="bolt-segment main s3"></span><span class="bolt-segment main s4"></span><span class="bolt-segment main s5"></span><span class="bolt-segment main s6"></span><span class="bolt-segment branch b1"></span><span class="bolt-segment branch b2"></span><span class="bolt-segment branch b3"></span><span class="bolt-segment branch b4"></span></div>
            <div class="lightning-bolt bolt-bottom-center"><span class="bolt-segment main s1"></span><span class="bolt-segment main s2"></span><span class="bolt-segment main s3"></span><span class="bolt-segment main s4"></span><span class="bolt-segment main s5"></span><span class="bolt-segment main s6"></span><span class="bolt-segment branch b1"></span><span class="bolt-segment branch b2"></span><span class="bolt-segment branch b3"></span><span class="bolt-segment branch b4"></span></div>
            <div class="lightning-bolt bolt-bottom-left"><span class="bolt-segment main s1"></span><span class="bolt-segment main s2"></span><span class="bolt-segment main s3"></span><span class="bolt-segment main s4"></span><span class="bolt-segment main s5"></span><span class="bolt-segment main s6"></span><span class="bolt-segment branch b1"></span><span class="bolt-segment branch b2"></span><span class="bolt-segment branch b3"></span><span class="bolt-segment branch b4"></span></div>

            <!-- LEFT EDGE -->
            <div class="lightning-bolt bolt-left-bottom"><span class="bolt-segment main s1"></span><span class="bolt-segment main s2"></span><span class="bolt-segment main s3"></span><span class="bolt-segment main s4"></span><span class="bolt-segment main s5"></span><span class="bolt-segment main s6"></span><span class="bolt-segment branch b1"></span><span class="bolt-segment branch b2"></span><span class="bolt-segment branch b3"></span><span class="bolt-segment branch b4"></span></div>
            <div class="lightning-bolt bolt-left-center"><span class="bolt-segment main s1"></span><span class="bolt-segment main s2"></span><span class="bolt-segment main s3"></span><span class="bolt-segment main s4"></span><span class="bolt-segment main s5"></span><span class="bolt-segment main s6"></span><span class="bolt-segment branch b1"></span><span class="bolt-segment branch b2"></span><span class="bolt-segment branch b3"></span><span class="bolt-segment branch b4"></span></div>
            <div class="lightning-bolt bolt-left-top"><span class="bolt-segment main s1"></span><span class="bolt-segment main s2"></span><span class="bolt-segment main s3"></span><span class="bolt-segment main s4"></span><span class="bolt-segment main s5"></span><span class="bolt-segment main s6"></span><span class="bolt-segment branch b1"></span><span class="bolt-segment branch b2"></span><span class="bolt-segment branch b3"></span><span class="bolt-segment branch b4"></span></div>

            <img id="main-image" class="alert_image" alt="Arcane follower alert" src="https://raw.githubusercontent.com/Ozanaltin/Twitch-Arcane-Follower-Alert/main/assets/Arcane-Follower-Purple.png">

            <div class="alert_text-container">
                <div class="alert_title">NEW FOLLOWER</div>
                <div class="alert_username"><span class="alert_variable-username">{username}</span></div>
                <div class="alert_subtitle">The Circle grows stronger.</div>
            </div>

        </div>
    </div>
</div>
</body>
</html>
